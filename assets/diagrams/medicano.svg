<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" font-family="'JetBrains Mono', ui-monospace, monospace">
  <!-- Diagrama de arquitetura do Medicano.
       Cores alinhadas ao tema do site: fundo transparente (o card fornece o
       fundo escuro), caixas grafite, acento verde-lima. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c6ff3d"/>
    </marker>
  </defs>

  <!-- ===== Conexões ===== -->
  <g stroke="#c6ff3d" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- React -> API -->
    <line x1="152" y1="158" x2="264" y2="158"/>
    <!-- API -> MongoDB -->
    <line x1="442" y1="136" x2="554" y2="100"/>
    <!-- API -> Redis -->
    <line x1="442" y1="182" x2="554" y2="202"/>
    <!-- API -> AWS (secrets + e-mails) -->
    <line x1="308" y1="208" x2="200" y2="246"/>
    <!-- API -> Claude API (triagem) -->
    <line x1="396" y1="208" x2="520" y2="258"/>
  </g>

  <!-- Rótulos das conexões -->
  <g fill="#9aa69d" font-size="10">
    <text x="208" y="148" text-anchor="middle">REST · SSE</text>
    <text x="500" y="106" text-anchor="middle">dados</text>
    <text x="500" y="182" text-anchor="middle">sessões</text>
    <text x="222" y="238" text-anchor="middle">config · e-mails</text>
    <text x="474" y="226" text-anchor="middle">triagem (LLM)</text>
  </g>

  <!-- ===== Cliente ===== -->
  <g>
    <rect x="20" y="130" width="132" height="56" rx="8" fill="#141a16" stroke="#26302a"/>
    <text x="86" y="154" text-anchor="middle" fill="#e8ede9" font-size="13" font-weight="600">React</text>
    <text x="86" y="172" text-anchor="middle" fill="#9aa69d" font-size="10">frontend web</text>
  </g>

  <!-- ===== API ===== -->
  <g>
    <rect x="264" y="110" width="178" height="98" rx="8" fill="#141a16" stroke="#c6ff3d"/>
    <text x="353" y="148" text-anchor="middle" fill="#e8ede9" font-size="14" font-weight="600">API NestJS</text>
    <text x="353" y="168" text-anchor="middle" fill="#9aa69d" font-size="10">TypeScript · monorepo</text>
    <text x="353" y="184" text-anchor="middle" fill="#9aa69d" font-size="10">RBAC · agendamentos</text>
  </g>

  <!-- ===== Dados ===== -->
  <g>
    <rect x="554" y="70" width="146" height="52" rx="8" fill="#141a16" stroke="#26302a"/>
    <text x="627" y="92" text-anchor="middle" fill="#e8ede9" font-size="13" font-weight="600">MongoDB</text>
    <text x="627" y="110" text-anchor="middle" fill="#9aa69d" font-size="10">Mongoose</text>

    <rect x="554" y="180" width="146" height="52" rx="8" fill="#141a16" stroke="#26302a"/>
    <text x="627" y="202" text-anchor="middle" fill="#e8ede9" font-size="13" font-weight="600">Redis</text>
    <text x="627" y="220" text-anchor="middle" fill="#9aa69d" font-size="10">tokens revogáveis</text>
  </g>

  <!-- ===== AWS (grupo tracejado) ===== -->
  <g>
    <rect x="36" y="246" width="304" height="74" rx="8" fill="none" stroke="#9aa69d" stroke-dasharray="5 5"/>
    <text x="50" y="240" fill="#9aa69d" font-size="10">AWS · sa-east-1</text>

    <rect x="52" y="262" width="152" height="42" rx="6" fill="#141a16" stroke="#26302a"/>
    <text x="128" y="287" text-anchor="middle" fill="#e8ede9" font-size="11" font-weight="600">Secrets Manager</text>

    <rect x="220" y="262" width="104" height="42" rx="6" fill="#141a16" stroke="#26302a"/>
    <text x="272" y="287" text-anchor="middle" fill="#e8ede9" font-size="11" font-weight="600">SES</text>
  </g>

  <!-- ===== Claude API ===== -->
  <g>
    <rect x="520" y="258" width="180" height="56" rx="8" fill="#141a16" stroke="#26302a"/>
    <text x="610" y="282" text-anchor="middle" fill="#e8ede9" font-size="13" font-weight="600">Claude API</text>
    <text x="610" y="300" text-anchor="middle" fill="#9aa69d" font-size="10">Vercel AI SDK · streaming</text>
  </g>
</svg>
